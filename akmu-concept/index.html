<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>소문의 낙원 — 컨셉 시안</title>
<meta name="description" content="AKMU '소문의 낙원' 컨셉으로 만든 비공식 인터랙티브 웹사이트 시안. 들판의 문을 열면 이찬혁의 방으로 넘어갑니다.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Nanum+Gothic+Coding:wght@400;700&family=Special+Elite&display=swap">
<style>
  /* Layout: two full-screen 3D spaces (field → room) joined by doors; UI is typed paper slips pinned over the scene. */
  :root {
    --paper: #F3ECDC;
    --paper-deep: #E4D8BE;
    --ink: #2B2620;
    --ink-soft: #6B5F50;
    --field: #8FAE5E;
    --sky: #B8D3DF;
    --marigold: #E9B949;
    --rust: #B4543A;
    --sheet: rgba(243, 236, 220, 0.86);
    --font-type: "Special Elite", "Nanum Gothic Coding", "Courier New", monospace;
    --font-ui: "Courier Prime", "Nanum Gothic Coding", "Courier New", monospace;
    color-scheme: light;
  }
  html, body { height: 100%; overflow: hidden; margin: 0; }
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body {
    background: var(--paper); color: var(--ink);
    font-family: var(--font-ui); font-size: 14px;
    -webkit-font-smoothing: antialiased; overscroll-behavior: none;
  }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 2px dashed var(--rust); outline-offset: 3px; }

  #stage { position: fixed; inset: 0; touch-action: none; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  body.fine #stage { cursor: none; }

  /* paper grain over everything */
  .grain {
    position: fixed; inset: 0; z-index: 40; pointer-events: none; opacity: .22; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .17  0 0 0 0 .15  0 0 0 0 .12  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* ---------- UI layer ---------- */
  .ui {
    position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: space-between;
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
    padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px);
    pointer-events: none; visibility: hidden;
  }
  body.entered .ui { visibility: visible; }
  .ui > * { pointer-events: auto; }
  .ui::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: calc(92px + env(safe-area-inset-top, 0px));
    background: linear-gradient(to bottom, rgba(243, 236, 220, .9), rgba(243, 236, 220, 0)); pointer-events: none;
  }
  .menu { display: flex; gap: 16px; position: relative; z-index: 3; }
  .mbtn {
    flex: 1 1 0; min-width: 0; text-align: left;
    padding: 20px 0 9px; font-family: var(--font-type); font-size: 16px; letter-spacing: .08em; text-transform: uppercase;
    border-bottom: 1.5px dashed var(--ink);
    display: flex; align-items: baseline; gap: 8px;
  }
  .mbtn small { font-family: var(--font-ui); font-size: 10px; letter-spacing: .04em; color: var(--ink-soft); text-transform: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mbtn.is-active { border-bottom-style: solid; border-bottom-width: 3px; padding-bottom: 7.5px; }
  .mbtn.is-active::before { content: "▸"; color: var(--rust); }
  .spacer { height: 1px; pointer-events: none; }

  .where {
    position: absolute; left: max(20px, env(safe-area-inset-left, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    display: grid; gap: 6px; justify-items: start;
  }
  .where-label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
  .where-name { font-family: var(--font-type); font-size: 22px; line-height: 1; background: var(--paper); padding: 4px 8px 2px; border: 1.5px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); }
  .travel { font-size: 12px; font-weight: 700; padding: 6px 10px; border: 1.5px solid var(--ink); background: var(--marigold); box-shadow: 2px 2px 0 var(--ink); }
  .travel:hover { background: var(--paper); }

  .mute {
    position: absolute; right: max(20px, env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    font-size: 12px; font-weight: 700; letter-spacing: .08em; padding: 8px 11px;
    border: 1.5px solid var(--ink); background: var(--paper); box-shadow: 2px 2px 0 var(--ink);
  }
  .hint {
    position: absolute; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    padding: 7px 12px; background: var(--paper); border: 1.5px dashed var(--ink); font-size: 13px; white-space: nowrap; pointer-events: none;
  }
  .toast {
    position: absolute; left: 50%; top: calc(86px + env(safe-area-inset-top, 0px)); transform: translateX(-50%) rotate(-.6deg);
    width: max-content; max-width: min(440px, calc(100% - 40px));
    padding: 12px 16px 11px; background: var(--paper); border: 1.5px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
    font-family: var(--font-type); font-size: 15px; line-height: 1.5; opacity: 0; visibility: hidden;
  }
  .toast small { display: block; font-family: var(--font-ui); font-size: 11px; color: var(--ink-soft); margin-top: 4px; }

  /* ---------- typed paper panel ---------- */
  .panel {
    position: absolute; left: max(20px, env(safe-area-inset-left, 0px));
    top: calc(86px + env(safe-area-inset-top, 0px)); bottom: calc(110px + env(safe-area-inset-bottom, 0px));
    width: 340px; display: flex; flex-direction: column; z-index: 2;
    background:
      repeating-linear-gradient(to bottom, transparent 0 27px, rgba(43, 38, 32, .08) 27px 28px),
      var(--sheet);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border: 1.5px solid var(--ink); box-shadow: 5px 5px 0 var(--ink);
  }
  .panel::before { content: ""; position: absolute; top: -9px; left: 50%; width: 70px; height: 18px; transform: translateX(-50%) rotate(-2deg); background: rgba(233, 185, 73, .75); border: 1px solid rgba(43, 38, 32, .25); }
  .panel-head { display: flex; align-items: center; gap: 10px; padding: 16px 12px 10px 16px; border-bottom: 1.5px solid var(--ink); }
  .panel-head h2 { flex: 1; min-width: 0; margin: 0; font-family: var(--font-type); font-weight: 400; font-size: 24px; line-height: 1.1; letter-spacing: .03em; }
  .pbtn { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 5px 8px; border: 1.5px solid var(--ink); background: var(--paper); }
  .pbtn:hover { background: var(--marigold); }
  .panel-body { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px; overscroll-behavior: contain; line-height: 1.55; }
  .panel-foot { margin: 0; padding: 8px 16px 10px; font-size: 10.5px; color: var(--ink-soft); border-top: 1px dashed rgba(43,38,32,.4); }
  .caret::after { content: "▌"; margin-left: 1px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .kicker { margin: 0 0 4px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
  .album-top { display: grid; grid-template-columns: 112px 1fr; gap: 14px; align-items: start; margin-bottom: 14px; }
  .album-top img { width: 112px; aspect-ratio: 1; border: 1.5px solid var(--ink); transform: rotate(-1.5deg); box-shadow: 3px 3px 0 var(--ink); }
  .album-top h3 { margin: 0 0 6px; font-family: var(--font-type); font-weight: 400; font-size: 19px; line-height: 1.25; text-wrap: balance; }
  .meta { margin: 0; font-size: 12px; color: var(--ink-soft); }
  .tracks { list-style: none; margin: 0 0 14px; padding: 0; border-top: 1.5px solid var(--ink); }
  .tracks li { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; padding: 6px 0; border-bottom: 1px dotted rgba(43,38,32,.45); font-size: 13px; }
  .tracks li span:first-child, .tracks li span:last-child { font-variant-numeric: tabular-nums; color: var(--ink-soft); }
  .tag { display: inline-block; margin-left: 6px; padding: 0 5px; font-size: 10px; font-weight: 700; letter-spacing: .06em; border: 1px solid var(--rust); color: var(--rust); vertical-align: 1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .note { margin: 12px 0 0; padding: 8px 10px; font-size: 12px; background: rgba(233,185,73,.22); border-left: 3px solid var(--marigold); }

  .vlist { display: grid; gap: 14px; }
  .vcard { display: grid; gap: 4px; text-align: left; }
  .vcard img { width: 100%; aspect-ratio: 16/9; border: 1.5px solid var(--ink); }
  .vcard:hover img { box-shadow: 3px 3px 0 var(--ink); transform: translate(-1px,-1px); }
  .vcard b { font-family: var(--font-type); font-weight: 400; font-size: 15px; }
  .vcard span { font-size: 12px; color: var(--ink-soft); }
  .vcard.is-playing span { color: var(--rust); font-weight: 700; }

  .rows { list-style: none; margin: 0; padding: 0; }
  .rows li { display: grid; grid-template-columns: 70px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px dotted rgba(43,38,32,.45); }
  .rows li:first-child { border-top: 1.5px solid var(--ink); }
  .rows time { font-family: var(--font-type); font-size: 17px; }
  .rows .place { display: grid; font-size: 13px; min-width: 0; }
  .rows .place span { font-size: 11.5px; color: var(--ink-soft); }

  .letter { display: grid; gap: 10px; }
  .letter dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13px; }
  .letter dt { color: var(--ink-soft); }
  .letter dd { margin: 0; user-select: all; overflow-wrap: anywhere; }
  .letter label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
  .letter textarea {
    width: 100%; box-sizing: border-box; min-height: 120px; resize: vertical; padding: 10px;
    font-family: var(--font-type); font-size: 15px; line-height: 1.6; color: var(--ink);
    background: repeating-linear-gradient(to bottom, #FBF7EE 0 23px, rgba(43,38,32,.12) 23px 24px); border: 1.5px solid var(--ink);
  }
  .goods { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .goods div { display: grid; gap: 3px; font-size: 12px; }
  .goods img { width: 100%; aspect-ratio: 1; border: 1.5px solid var(--ink); }
  .goods b { font-family: var(--font-type); font-weight: 400; font-size: 14px; }
  .store { display: inline-block; margin-top: 14px; font-weight: 700; font-size: 12px; letter-spacing: .08em; color: var(--ink); background: var(--marigold); border: 1.5px solid var(--ink); padding: 8px 11px; text-decoration: none; box-shadow: 2px 2px 0 var(--ink); }

  /* ---------- door transition ---------- */
  .veil {
    position: fixed; inset: 0; z-index: 25; display: grid; place-items: center; text-align: center;
    background: var(--paper); opacity: 0; visibility: hidden; padding-inline: 24px;
  }
  .veil p { margin: 0; font-family: var(--font-type); font-size: clamp(20px, 3.4vw, 34px); line-height: 1.4; }
  .veil small { display: block; margin-top: 10px; font-family: var(--font-ui); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }

  /* ---------- intro ---------- */
  .intro {
    position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; text-align: center;
    background: var(--paper);
    padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-block: 24px;
  }
  .intro-tag { position: absolute; top: calc(18px + env(safe-area-inset-top, 0px)); left: max(20px, env(safe-area-inset-left, 0px)); right: max(20px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; gap: 12px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
  .intro-sheet {
    width: min(520px, 100%); padding: 44px 36px 34px; position: relative;
    background: repeating-linear-gradient(to bottom, #FBF7EE 0 31px, rgba(43,38,32,.08) 31px 32px);
    border: 1.5px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); transform: rotate(-.8deg);
  }
  .intro-sheet::before { content: ""; position: absolute; top: -10px; left: 50%; width: 90px; height: 20px; transform: translateX(-50%) rotate(3deg); background: rgba(233,185,73,.8); border: 1px solid rgba(43,38,32,.25); }
  .intro h1 { margin: 0; font-family: var(--font-type); font-weight: 400; font-size: clamp(40px, 8vw, 64px); line-height: 1.05; letter-spacing: .02em; min-height: 1.05em; }
  .intro .en { margin: 10px 0 0; font-family: var(--font-type); font-size: 15px; letter-spacing: .3em; min-height: 1.5em; }
  .intro .line { margin: 22px auto 0; max-width: 30ch; font-size: 14px; line-height: 1.8; min-height: 3.6em; }
  .intro-foot { margin-top: 22px; min-height: 44px; display: grid; justify-items: center; gap: 8px; }
  .loading { font-size: 12px; letter-spacing: .2em; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .enter { font-family: var(--font-type); font-size: 17px; letter-spacing: .06em; padding: 10px 18px 8px; border: 1.5px solid var(--ink); background: var(--marigold); box-shadow: 3px 3px 0 var(--ink); transition: transform .2s ease, box-shadow .2s ease; }
  .enter:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--ink); }
  .enter-note { margin: 0; font-size: 12px; color: var(--ink-soft); }

  /* ---------- cursor ---------- */
  .cursor { position: fixed; left: 0; top: 0; z-index: 50; pointer-events: none; display: none; }
  body.fine .cursor { display: block; }
  .cursor.is-hidden { visibility: hidden; }
  .cursor-inner { display: flex; align-items: flex-start; gap: 4px; transform-origin: 3px 3px; transition: transform .18s ease; }
  .cursor.is-hot .cursor-inner { transform: scale(1.15); }
  .cursor.is-down .cursor-inner { transform: scale(.88); }
  .cursor svg { width: 30px; height: 30px; flex: none; }
  .cursor-label { margin-top: 20px; padding: 3px 7px 2px; background: var(--paper); border: 1.5px solid var(--ink); font-family: var(--font-type); font-size: 12px; white-space: nowrap; opacity: 0; transition: opacity .2s ease; }
  .cursor.is-hot .cursor-label { opacity: 1; }

  @media (max-width: 640px) {
    .ui { flex-direction: column-reverse; }
    .ui::before { top: auto; bottom: 0; height: calc(96px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, rgba(243,236,220,.95), rgba(243,236,220,0)); }
    .menu { gap: 6px; padding-bottom: 6px; }
    .mbtn { font-size: 12px; letter-spacing: .02em; justify-content: center; padding: 14px 0 10px; border-bottom: 0; border-top: 1.5px dashed var(--ink); }
    .mbtn small { display: none; }
    .mbtn.is-active { border-bottom: 0; padding-bottom: 10px; border-top: 3px solid var(--ink); padding-top: 12.5px; }
    .mbtn.is-active::before { display: none; }
    .where { bottom: auto; top: calc(14px + env(safe-area-inset-top, 0px)); }
    .where-name { font-size: 17px; }
    .mute { bottom: auto; top: calc(14px + env(safe-area-inset-top, 0px)); }
    .hint { bottom: calc(72px + env(safe-area-inset-bottom, 0px)); font-size: 12px; }
    .toast { top: calc(112px + env(safe-area-inset-top, 0px)); font-size: 14px; }
    .panel { top: auto; width: auto; right: max(20px, env(safe-area-inset-right, 0px)); bottom: calc(64px + env(safe-area-inset-bottom, 0px)); max-height: min(58%, 480px); box-shadow: 4px 4px 0 var(--ink); }
    .intro-sheet { padding: 38px 22px 28px; }
  }
  @media (prefers-reduced-motion: reduce) { .caret::after { animation: none; } }
</style>
</head>
<body>
<div id="stage" aria-label="들판과 방으로 이루어진 3D 공간"></div>

<div class="ui" id="ui">
  <nav class="menu" id="menu" aria-label="메뉴">
    <button class="mbtn" data-key="music"><span>Music</span><small>방 · 턴테이블</small></button>
    <button class="mbtn" data-key="video"><span>Video</span><small>방 · TV</small></button>
    <button class="mbtn" data-key="tour"><span>Tour</span><small>낙원 · 이정표</small></button>
    <button class="mbtn" data-key="contact"><span>Letter</span><small>방 · 타자기</small></button>
    <button class="mbtn" data-key="shop"><span>Shop</span><small>낙원 · 가판대</small></button>
  </nav>
  <div class="spacer"></div>

  <aside class="panel" id="panel" hidden aria-labelledby="pTitle">
    <header class="panel-head">
      <h2 id="pTitle"></h2>
      <button class="pbtn" id="pClose" aria-label="패널 닫기">Close</button>
    </header>
    <div class="panel-body" id="pBody"></div>
    <p class="panel-foot">비공식 컨셉 시안 · AKMU 및 소속사와 무관 · 이미지·영상·음원 미포함</p>
  </aside>

  <div class="where" id="where">
    <span class="where-label">Now</span>
    <span class="where-name" id="whereName">소문의 낙원</span>
    <button class="travel" id="travel">이찬혁의 방으로 →</button>
  </div>
  <button class="mute" id="mute" aria-pressed="false">SOUND ON</button>
  <div class="hint" id="hint" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<div class="veil" id="veil" aria-hidden="true"><div><p id="veilText"></p><small id="veilSub"></small></div></div>

<div class="intro" id="intro">
  <div class="intro-tag"><span>Concept draft · 비공식 시안</span><span>AKMU 및 소속사와 무관</span></div>
  <div class="intro-sheet">
    <h1 id="iTitle"></h1>
    <p class="en" id="iEn"></p>
    <p class="line" id="iLine"></p>
    <div class="intro-foot" id="iFoot"><span class="loading" id="loading">LOADING</span></div>
  </div>
</div>

<div class="cursor is-hidden" id="cursor" aria-hidden="true">
  <div class="cursor-inner">
    <svg viewBox="0 0 30 30"><path d="M4 3v21l5.8-5.4 4 8.6 3.8-1.7-4-8.4H21z" fill="#F3ECDC" stroke="#2B2620" stroke-width="1.9" stroke-linejoin="round"/></svg>
    <span class="cursor-label" id="cursorLabel"></span>
  </div>
</div>

<div class="grain" aria-hidden="true"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(() => {
  "use strict";
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const D = reduceMotion ? 0.01 : 1;
  const finePointer = matchMedia("(pointer: fine)").matches;
  if (finePointer) document.body.classList.add("fine");
  const isPhone = () => innerWidth <= 640;
  const $ = (id) => document.getElementById(id);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const smooth = (x, a, b) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const wait = (ms) => new Promise((r) => setTimeout(r, reduceMotion ? 0 : ms));

  const C = {
    paper: "#F3ECDC", paperDeep: "#E4D8BE", ink: "#2B2620", inkSoft: "#6B5F50",
    field: "#8FAE5E", fieldDeep: "#5E7F3F", gold: "#C9B25A", sky: "#B8D3DF", haze: "#E8E2CF",
    marigold: "#E9B949", rust: "#B4543A", dusk: "#6F7FA6", wood: "#B88555", woodDark: "#83593A", olive: "#5D6B45", cream: "#FBF7EE",
  };
  const FONT_TYPE = '"Special Elite", "Nanum Gothic Coding", monospace';
  const FONT_UI = '"Courier Prime", "Nanum Gothic Coding", monospace';

  /* ================= Content (album facts; everything else is a placeholder) ================= */
  const ALBUM = {
    artist: "AKMU", title: "개화", en: "Flowering", kind: "정규 4집", date: "2026.04.07", total: "37:20",
    tracks: [
      ["소문의 낙원", "Paradise of Rumors", "3:38", "선공개"], ["봄 색깔", "Spring Colors", "3:10"], ["벌레를 내고", "Paid with Bugs", "3:40"],
      ["기쁨, 슬픔, 아름다운 마음", "Joy, Sorrow, a Beautiful Heart", "4:36", "TITLE"], ["햇빛 bless you", "Sunshine Bless You", "3:51"],
      ["Tent", "Tent", "2:30"], ["어린 부부", "Young and Married", "2:58"], ["옳은 사람", "The Right Person", "3:42"],
      ["우아한 아침 식사", "Graceful Breakfast", "3:08"], ["난민들의 축제", "Festival of Refugees", "3:05"], ["얼룩", "Stains", "3:02"],
    ],
  };

    nd.userData.hinge.rotation.y = -1.35;
    updateWhere();
    await gsap.timeline()
      .to("#veil", { autoAlpha: 0, duration: 0.6 * D })
      .to(camera.position, { x: end.x, y: end.y, z: end.z, duration: 1.6 * D, ease: "power2.out" }, 0)
      .to(view, { fov: 75, duration: 1.6 * D, ease: "power2.out" }, 0)
      .to(nd.userData.hinge.rotation, { y: -0.38, duration: 1.0 * D, ease: "power2.inOut" }, 0.7 * D);
    vt.textContent = ""; transitioning = false; showHint();
  }
  travelBtn.addEventListener("click", () => { if (entered) { sfx.ui(); goTo(current === "paradise" ? "room" : "paradise"); } });

  /* ================= actions ================= */
  async function activate(key, fromMenu) {
    if (transitioning) return;
    dismissHint();
    if (HOME[key] && HOME[key] !== current) { await goTo(HOME[key]); return activate(key, fromMenu); }
    switch (key) {
      case "door": return goTo("room");
      case "doorBack": return goTo("paradise");
      case "flowers": sfx.bloom(); bloom.t0 = performance.now(); return toast("꽃이 피었다.", "개화 · Flowering — 정규 4집");
      case "rumor": { sfx.paper(); const s = slips[Math.floor(Math.random() * slips.length)]; gsap.fromTo(s.rotation, { z: 0 }, { z: Math.PI * 2, duration: 1.2 * D, ease: "power2.out" }); return toast(RUMORS[Math.floor(Math.random() * RUMORS.length)], "소문 쪽지 · 컨셉 문구"); }
      case "ger": sfx.tent(); return toast("바람이 텐트 천을 흔든다.", "06  Tent · 2:30");
      case "breakfast": sfx.clink(); return toast("누군가 아침상을 차려 두었다.", "09  우아한 아침 식사 · 3:08");
      case "piano": sfx.piano(); return toast("건반 위에 먼지가 없다. 자주 치는 모양이다.", "피아노 · 컨셉 오브젝트");
      case "guitar": sfx.guitar(); return toast("줄이 조금 풀려 있다.", "기타 · 컨셉 오브젝트");
      case "notes": sfx.paper(); return toast("벽에 앨범 메모가 핀으로 꽂혀 있다.", "개화 · 2026.04.07 · 11곡");
    }
    if (!fromMenu) ({ music: sfx.ui, video: sfx.ui, contact: sfx.key, tour: sfx.paper, shop: sfx.paper })[key]();
    if (activeKey === "video" && key !== "video") stopVideo();
    activeKey = key; refreshGlow(); menuSelect(key);
    lookAtKey(key); openPanel(key);
  }

  /* ================= menu ================= */
  const menu = $("menu");
  menu.addEventListener("click", (e) => { const b = e.target.closest(".mbtn"); if (!b || !entered || transitioning) return; sfx.ui(); activate(b.dataset.key, true); });
  function menuSelect(key) {
    const btns = [...menu.children], first = new Map(btns.map((b) => [b, b.getBoundingClientRect().left]));
    const idx = btns.findIndex((b) => b.dataset.key === key);
    if (idx > 0) [...btns.slice(idx), ...btns.slice(0, idx)].forEach((b) => menu.appendChild(b));
    btns.forEach((b) => {
      const on = b.dataset.key === key; b.classList.toggle("is-active", on); if (on) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current");
      const dx = first.get(b) - b.getBoundingClientRect().left; if (!dx) return;
      if (dx < 0) gsap.fromTo(b, { x: 50, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.7 * D, ease: "power3.out", delay: 0.1 * D });
      else gsap.fromTo(b, { x: dx }, { x: 0, duration: 0.8 * D, ease: "power3.inOut" });
    });
  }
  function menuClear() { [...menu.children].forEach((b) => { b.classList.remove("is-active"); b.removeAttribute("aria-current"); }); }

  /* ================= panel ================= */
  const panel = $("panel"), pBody = $("pBody"), pTitle = $("pTitle");
  $("pClose").addEventListener("click", () => closePanel(true));
  function openPanel(key) {
    ({ music: renderMusic, video: renderVideo, tour: renderTour, contact: renderLetter, shop: renderShop })[key]();
    pBody.scrollTop = 0; panel.hidden = false;
    pTitle.textContent = "";
    gsap.fromTo(panel, isPhone() ? { autoAlpha: 0, y: 30, rotate: 0 } : { autoAlpha: 0, x: -24, rotate: -1.5 }, { autoAlpha: 1, x: 0, y: 0, rotate: -0.4, duration: 0.5 * D, delay: 0.5 * D, ease: "power3.out", overwrite: true, onComplete: () => typeInto(pTitle, TITLES[key], { speed: 55 }) });
  }
  function closePanel(withZoom) {
    if (activeKey === "video") stopVideo();
    activeKey = null; refreshGlow(); menuClear();
    gsap.to(panel, { autoAlpha: 0, duration: 0.25 * D, overwrite: true, onComplete: () => { panel.hidden = true; } });
    if (withZoom) zoomOut();
  }
  let cover;
  function renderMusic() {
    pBody.innerHTML = `
      <div class="album-top"><img src="${cover}" alt="커버 이미지 자리">
        <div><p class="kicker">${ALBUM.artist} · ${ALBUM.kind}</p><h3>${ALBUM.title} <br>(${ALBUM.en})</h3><p class="meta">${ALBUM.date} · ${ALBUM.tracks.length}곡 · ${ALBUM.total}</p></div></div>
      <ol class="tracks">${ALBUM.tracks.map(([ko, en, len, tag], i) => `<li><span>${String(i + 1).padStart(2, "0")}</span><span>${ko}${tag ? `<span class="tag">${tag}</span>` : ""}</span><span>${len}</span></li>`).join("")}</ol>
      <p class="kicker">Listen on</p>
      <div class="chips">${["Melon", "Spotify", "Apple Music", "YouTube Music"].map((s) => `<button class="pbtn sample">${s}</button>`).join("")}</div>
      <p class="note">커버 이미지와 스트리밍 링크는 자리만 잡아 두었습니다. 공식 에셋으로 교체하세요.</p>`;
    bindSamples();
  }
  function renderVideo() {
    pBody.innerHTML = `<div class="vlist">${VIDEOS.map((v, i) => `
      <button class="vcard${tv.playing === i ? " is-playing" : ""}" data-i="${i}"><img src="${v.poster}" alt=""><b>${v.title}</b><span>${tv.playing === i ? "■ 방 안 TV에서 재생 중 · 눌러서 정지" : v.sub + " · " + v.len}</span></button>`).join("")}</div>
      <p class="note">영상은 실제 URL 대신 TV 속 그림으로 대신했습니다. 공식 영상 링크를 연결하면 TV 화면에 재생됩니다.</p>`;
    pBody.querySelectorAll(".vcard").forEach((b) => b.addEventListener("click", () => {
      const i = +b.dataset.i; if (tv.playing === i) stopVideo(); else playVideo(i);
      const st = pBody.scrollTop; renderVideo(); pBody.scrollTop = st;
    }));
  }
  function playVideo(i) { tv.playing = i; tv.start = performance.now(); sfx.ui(); if (audio.ctx) { const g = audio.amb.room.gain, t = audio.ctx.currentTime; g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(0.25, t + 0.6); } }
  function stopVideo() { if (tv.playing < 0) return; tv.playing = -1; if (current === "room") setAmbience("room", 0.6); }
  function renderTour() {
    pBody.innerHTML = `
      <p class="kicker">Concept concert</p>
      <h3 style="margin:0 0 6px;font-family:var(--font-type);font-weight:400;font-size:20px">AKMU CONCERT ‘소문의 낙원’</h3>
      <p class="meta" style="margin-bottom:14px">날짜·장소·예매처는 공식 공지 기준으로 채워 넣는 자리입니다.</p>
      <ul class="rows">${[["MM.DD", "도시", "공연장 이름 · 시간"], ["MM.DD", "도시", "공연장 이름 · 시간"], ["MM.DD", "도시", "공연장 이름 · 시간"]].map(([d, c, v]) => `
        <li><time>${d}</time><div class="place"><b>${c}</b><span>${v}</span></div><button class="pbtn sample">예매</button></li>`).join("")}</ul>
      <p class="note">이정표처럼, 공연 정보가 생기면 이 목록이 길어집니다.</p>`;
    bindSamples();
  }
  function renderLetter() {
    pBody.innerHTML = `
      <div class="letter">
        <p class="kicker">To. 이 방의 주인에게</p>
        <dl><dt>문의</dt><dd>contact@example.com</dd><dt>섭외</dt><dd>booking@example.com</dd><dt>팬레터</dt><dd>주소 입력 자리</dd></dl>
        <label for="letterText">편지 쓰기</label>
        <textarea id="letterText" placeholder="여기에 쓰면 타자기 소리가 납니다."></textarea>
        <button class="pbtn" id="sendLetter" style="justify-self:start">봉투에 넣기</button>
      </div>
      <p class="note">연락처는 예시입니다. 시안이라 편지는 실제로 보내지지 않아요.</p>`;
    const ta = $("letterText");
    ta.addEventListener("keydown", (e) => { if (e.key === "Enter") sfx.ding(); else if (e.key.length === 1 || e.key === "Backspace") sfx.key(); });
    $("sendLetter").addEventListener("click", () => { sfx.paper(); toast(ta.value.trim() ? "편지를 봉투에 넣었다. (시안이라 발송되지 않음)" : "아직 아무것도 쓰지 않았다."); });
  }
  function renderShop() {
    pBody.innerHTML = `
      <p class="kicker">난민들의 축제 · 가판대</p>
      <div class="goods">${goods.map((g) => `<div><img src="${g.img}" alt=""><b>${g.name}</b><span>${g.price}</span></div>`).join("")}</div>
      <a class="store" href="https://example.com" target="_blank" rel="noopener">스토어 열기 ↗</a>
      <p class="note">상품과 가격은 예시입니다. 공식 스토어 주소로 바꿔 연결하세요.</p>`;
  }
  function bindSamples() { pBody.querySelectorAll(".sample").forEach((b) => b.addEventListener("click", () => toast(`${b.textContent} 링크 자리`, "실제 URL은 공식 채널 기준으로 연결"))); }

  /* ================= hint ================= */
  let hintShown = false;
  function setHint(t) { $("hint").textContent = t; }
  function showHint() { if (!entered) return; const h = $("hint"); h.hidden = false; hintShown = true; gsap.fromTo(h, { autoAlpha: 0, y: 8 }, { autoAlpha: 1, y: 0, duration: 0.5 }); }
  function dismissHint() { if (!hintShown) return; hintShown = false; gsap.to($("hint"), { autoAlpha: 0, duration: 0.3, onComplete: () => ($("hint").hidden = true) }); }

  /* ================= enter ================= */
  function enter() {
    audioInit(); sfx.ding();
    document.body.classList.add("entered"); updateWhere();
    gsap.to("#intro", { autoAlpha: 0, duration: 0.6 * D, onComplete: () => ($("intro").hidden = true) });
    gsap.fromTo(view, { fov: 100, pitch: 0.6, yaw: -0.08 }, { fov: 75, pitch: -0.02, duration: 2.6 * D, ease: "power3.inOut", delay: 0.2 * D, onComplete: () => { entered = true; showHint(); } });
    gsap.from(".mbtn", { autoAlpha: 0, y: isPhone() ? 14 : -14, stagger: 0.07, duration: 0.5 * D, delay: 1.6 * D });
    gsap.from(["#where", "#mute"], { autoAlpha: 0, duration: 0.5 * D, delay: 1.9 * D });
  }

  /* ================= loop ================= */
  let lastT = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
    if (entered && !transitioning && !down && (Math.abs(vel.x) > 1e-5 || Math.abs(vel.y) > 1e-5)) { view.yaw += vel.x; view.pitch = clamp(view.pitch + vel.y, -1.1, 1.1); vel.x *= 0.9; vel.y *= 0.9; }
    if (hoverQueued && finePointer && !transitioning) {
      hoverQueued = false; const k = pick(cx, cy);
      if (k !== hoverKey) { hoverKey = k; refreshGlow(); }
      cursor.classList.toggle("is-hot", !!k); if (k) cursorLabel.textContent = LABELS[k];
    }
    applyView();
    if (current === "paradise") {
      updateFlowers(now);
      slips.forEach((s) => { const b = s.userData.base; s.position.y = b.y + Math.sin(now / 1000 * b.sp + b.ph) * 0.12; s.rotation.x = Math.sin(now / 1400 + b.ph) * 0.15; });
      clouds.rotation.y += dt * 0.004;
    } else {
      record.rotation.y -= dt * (activeKey === "music" ? 3.5 : 0.4);
      drawTV(now);
    }
    renderer.render(spaces[current].scene, camera);
    requestAnimationFrame(loop);
  }

  /* ================= boot ================= */
  let goods = [];
  const fontLoads = document.fonts ? Promise.all([`20px "Special Elite"`, `700 16px "Courier Prime"`, `16px "Nanum Gothic Coding"`].map((f) => document.fonts.load(f))) : Promise.resolve();
  Promise.race([fontLoads, new Promise((r) => setTimeout(r, 1800))]).catch(() => {}).then(() => {
    textures.forEach((t) => t.redraw());
    cover = coverArt().toDataURL("image/jpeg", 0.88);
    VIDEOS.forEach((v) => (v.poster = posterArt(v).toDataURL("image/jpeg", 0.85)));
    goods = [["개화 LP (예시)", "₩ —", 61], ["낙원 엽서 세트 (예시)", "₩ —", 62], ["소문 쪽지 노트 (예시)", "₩ —", 63], ["들판 포스터 (예시)", "₩ —", 64]].map(([name, price, seed]) => ({ name, price, img: goodsArt(seed, name.split(" (")[0]).toDataURL("image/jpeg", 0.85) }));
    applyView(); requestAnimationFrame(loop);
    sceneReadyResolve(true);
  });
})();
</script>
</body>
</html>
