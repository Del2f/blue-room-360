<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="하늘색 방을 360도로 둘러보는 인터랙티브 아티스트 사이트 프로토타입">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Blue Room 360</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
  /* Layout: one full-screen 3D room; UI floats on top as inked glass cards (left panel on desktop, bottom sheet on phones). */
  :root {
    --sky: #A9D8F2;        /* main light blue */
    --sky-pale: #DDF1FB;
    --sky-deep: #3D6FB6;
    --ink: #13233F;        /* outline / text navy */
    --paper: #F7FBFF;
    --coral: #F07A5E;
    --sun: #F2C14E;
    --glass: rgba(247, 251, 255, 0.66);
    --font-display: "Bagel Fat One", "IBM Plex Sans KR", system-ui, sans-serif;
    --font-ui: "IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    color-scheme: light;
  }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--sky);
    color: var(--ink);
    font-family: var(--font-ui);
    font-weight: 500;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; }

  #stage { position: fixed; inset: 0; touch-action: none; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  body.fine #stage { cursor: none; }

  /* ---------- UI layer ---------- */
  .ui {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; justify-content: space-between;
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
    padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px);
    pointer-events: none;
    visibility: hidden;
  }
  body.entered .ui { visibility: visible; }
  .ui > * { pointer-events: auto; }

  .ui::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: calc(96px + env(safe-area-inset-top, 0px));
    background: linear-gradient(to bottom, rgba(221, 241, 251, 0.92), rgba(221, 241, 251, 0));
    pointer-events: none;
  }
  .menu { display: flex; gap: 16px; position: relative; z-index: 3; }
  .mbtn {
    flex: 1 1 0; min-width: 0;
    text-align: left;
    padding: 20px 0 10px;
    font-weight: 700; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase;
    border-bottom: 1.5px solid var(--ink);
    display: flex; align-items: center; justify-content: flex-start; gap: 8px;
  }
  .mbtn .dot { order: -1; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--ink); background: transparent; transition: background-color .25s ease; flex: none; }
  .mbtn:hover .dot { background: var(--paper); }
  .mbtn.is-active { border-bottom-width: 3px; padding-bottom: 8.5px; }
  .mbtn.is-active .dot { background: var(--coral); }
  .bottom-spacer { height: 1px; pointer-events: none; }

  .mute {
    position: absolute;
    right: max(20px, env(safe-area-inset-right, 0px));
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    width: 44px; height: 44px; border-radius: 50%;
    border: 1.5px solid var(--ink); background: var(--glass);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    display: grid; place-items: center;
    box-shadow: 2px 2px 0 var(--ink);
  }
  .mute svg { width: 20px; height: 20px; }
  .mute .off { display: none; }
  .mute[aria-pressed="true"] .on { display: none; }
  .mute[aria-pressed="true"] .off { display: block; }

  .hint {
    position: absolute; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    padding: 8px 14px; border-radius: 999px;
    background: var(--glass); border: 1.5px solid var(--ink);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    font-size: 13px; white-space: nowrap;
    pointer-events: none;
  }

  .toast {
    position: absolute; left: 50%; top: calc(84px + env(safe-area-inset-top, 0px));
    transform: translateX(-50%);
    max-width: min(420px, calc(100% - 40px));
    padding: 10px 14px; border-radius: 6px;
    background: var(--ink); color: var(--paper);
    font-size: 13px; line-height: 1.45; text-align: center;
    opacity: 0; visibility: hidden;
  }
  .toast a { color: var(--sun); font-weight: 700; }

  /* ---------- Panel ---------- */
  .panel {
    position: absolute;
    left: max(20px, env(safe-area-inset-left, 0px));
    top: calc(84px + env(safe-area-inset-top, 0px));
    bottom: calc(86px + env(safe-area-inset-bottom, 0px));
    width: 330px;
    display: flex; flex-direction: column;
    background: var(--glass);
    -webkit-backdrop-filter: blur(18px) saturate(1.2); backdrop-filter: blur(18px) saturate(1.2);
    border: 1.5px solid var(--ink); border-radius: 6px;
    box-shadow: 5px 5px 0 var(--ink);
    z-index: 2;
  }
  .panel-head {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 12px 10px 14px;
    border-bottom: 1.5px solid var(--ink);
  }
  .panel-head h2 { flex: 1; min-width: 0; margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 22px; letter-spacing: 0.02em; line-height: 1; }
  .pbtn {
    font-weight: 700; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 6px 9px; border: 1.5px solid var(--ink); border-radius: 4px; background: var(--paper);
    transition: background-color .25s ease;
  }
  .pbtn:hover { background: var(--sun); }
  .panel-body { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; overscroll-behavior: contain; }
  .panel-foot { margin: 0; padding: 8px 14px 10px; font-size: 11px; color: var(--sky-deep); border-top: 1px dashed rgba(19,35,63,.35); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 12px; }
  .grid.wide { grid-template-columns: 1fr; }
  .card { display: grid; gap: 4px; text-align: left; min-width: 0; }
  .card img { width: 100%; max-width: 100%; aspect-ratio: 1; object-fit: cover; border: 1.5px solid var(--ink); border-radius: 4px; transition: transform .25s ease, box-shadow .25s ease; background: var(--sky-pale); }
  .grid.wide .card img { aspect-ratio: 16 / 9; }
  .card:hover img { transform: translate(-2px, -2px); box-shadow: 3px 3px 0 var(--ink); }
  .card-artist { font-weight: 700; font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; margin-top: 4px; }
  .card-title { font-size: 13px; line-height: 1.35; }
  .card-meta { font-family: var(--font-mono); font-size: 11px; color: var(--sky-deep); }
  .card.is-playing .card-meta { color: var(--coral); font-weight: 600; }

  .album { display: grid; gap: 12px; }
  .album img { width: 100%; max-width: 100%; aspect-ratio: 1; border: 1.5px solid var(--ink); border-radius: 4px; }
  .album h3 { margin: 0; font-size: 18px; line-height: 1.3; text-wrap: balance; }
  .album .card-artist { margin: 0; }
  .tracks { list-style: none; margin: 0; padding: 0; border-top: 1.5px solid var(--ink); }
  .tracks li { display: flex; gap: 10px; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(19,35,63,.2); font-size: 13px; }
  .tracks li span:last-child { font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums; flex: none; }
  .label { font-weight: 700; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--sky-deep); margin: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }

  .tour { list-style: none; margin: 0; padding: 0; display: grid; }
  .tour li { display: grid; grid-template-columns: 58px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(19,35,63,.2); }
  .tour li:first-child { border-top: 1.5px solid var(--ink); }
  .t-date { display: grid; justify-items: start; font-family: var(--font-mono); font-variant-numeric: tabular-nums; line-height: 1.1; }
  .t-date small { font-size: 11px; color: var(--sky-deep); }
  .t-date b { font-size: 20px; font-weight: 600; }
  .t-place { min-width: 0; display: grid; gap: 2px; font-size: 13px; }
  .t-place b { font-size: 14px; }
  .t-place span { color: var(--sky-deep); font-size: 12px; }
  .pbtn.sold { background: transparent; text-decoration: line-through; opacity: .6; cursor: default; }
  .pbtn.soon { background: transparent; }

  .contact { display: grid; gap: 18px; }
  .contact section { display: grid; gap: 8px; }
  .crow { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding-bottom: 8px; border-bottom: 1px solid rgba(19,35,63,.2); }
  .crow b { font-size: 13px; }
  .crow code { grid-column: 1; font-family: var(--font-mono); font-size: 12px; user-select: all; overflow-wrap: anywhere; }
  .crow .pbtn { grid-column: 2; grid-row: 1 / span 2; }

  .shop-note { margin: 14px 0 0; font-size: 12px; line-height: 1.5; color: var(--sky-deep); }
  .store-link { display: inline-block; margin-top: 12px; font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); background: var(--sun); border: 1.5px solid var(--ink); border-radius: 4px; padding: 9px 12px; text-decoration: none; box-shadow: 2px 2px 0 var(--ink); }

  /* ---------- Intro ---------- */
  .intro {
    position: fixed; inset: 0; z-index: 20;
    background: var(--sky);
    display: grid; place-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px;
    text-align: center;
  }
  .intro-tag { position: absolute; top: calc(18px + env(safe-area-inset-top, 0px)); left: max(20px, env(safe-area-inset-left, 0px)); font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  .logo { width: min(300px, 72vw); height: auto; display: block; margin: 0 auto; }
  .intro-text { margin-top: 26px; min-height: 64px; display: grid; justify-items: center; gap: 10px; }
  .loading { font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em; font-variant-numeric: tabular-nums; }
  .enter-note { font-size: 13px; margin: 0; }
  .enter {
    font-weight: 700; font-size: 14px; letter-spacing: .08em; text-transform: uppercase;
    padding: 10px 16px; border: 1.5px solid var(--ink); border-radius: 4px; background: var(--paper);
    box-shadow: 3px 3px 0 var(--ink); transition: transform .2s ease, box-shadow .2s ease, background-color .2s ease;
  }
  .enter:hover { background: var(--sun); transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--ink); }
  .nogl { max-width: 34ch; font-size: 14px; line-height: 1.6; }

  /* ---------- Cursor ---------- */
  .cursor { position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none; display: none; }
  body.fine .cursor { display: block; }
  .cursor-inner { display: flex; align-items: flex-start; gap: 4px; transform-origin: 3px 2px; transition: transform .18s ease; }
  .cursor.is-hot .cursor-inner { transform: scale(1.18); }
  .cursor.is-down .cursor-inner { transform: scale(.88); }
  .cursor svg { width: 28px; height: 28px; flex: none; }
  .cursor-label { margin-top: 18px; padding: 3px 8px; border-radius: 999px; background: var(--ink); color: var(--paper); font-size: 11px; font-weight: 700; letter-spacing: .06em; white-space: nowrap; opacity: 0; transition: opacity .2s ease; }
  .cursor.is-hot .cursor-label { opacity: 1; }
  .cursor.is-hidden { visibility: hidden; }

  /* ---------- Phones ---------- */
  @media (max-width: 640px) {
    .ui { flex-direction: column-reverse; }
    .ui::before { top: auto; bottom: 0; height: calc(90px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, rgba(221, 241, 251, 0.95), rgba(221, 241, 251, 0)); }
    .menu { gap: 8px; padding-bottom: 6px; }
    .mbtn { font-size: 12px; letter-spacing: .03em; padding: 14px 0 10px; justify-content: center; border-bottom: 0; border-top: 1.5px solid var(--ink); }
    .mbtn.is-active { border-bottom: 0; padding-bottom: 10px; border-top-width: 3px; padding-top: 12.5px; }
    .mbtn .dot { display: none; }
    .mute { bottom: auto; top: calc(14px + env(safe-area-inset-top, 0px)); width: 40px; height: 40px; }
    .hint { bottom: calc(70px + env(safe-area-inset-bottom, 0px)); font-size: 12px; }
    .toast { top: calc(66px + env(safe-area-inset-top, 0px)); }
    .panel {
      top: auto; width: auto;
      right: max(20px, env(safe-area-inset-right, 0px));
      bottom: calc(62px + env(safe-area-inset-bottom, 0px));
      max-height: min(56%, 460px);
      box-shadow: 4px 4px 0 var(--ink);
    }
    .grid:not(.wide) { grid-auto-flow: column; grid-template-columns: none; grid-auto-columns: 40%; overflow-x: auto; padding-bottom: 4px; }
    .grid.wide { grid-auto-flow: column; grid-template-columns: none; grid-auto-columns: 70%; overflow-x: auto; padding-bottom: 4px; }
    .album { grid-template-columns: 110px 1fr; align-items: start; }
    .album > :not(.album-cover):not(.album-info) { grid-column: 1 / -1; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div id="stage" aria-label="360도로 둘러볼 수 있는 하늘색 방"></div>

<div class="ui" id="ui">
  <nav class="menu" id="menu" aria-label="메뉴">
    <button class="mbtn" data-key="music"><span>Music</span><i class="dot"></i></button>
    <button class="mbtn" data-key="video"><span>Video</span><i class="dot"></i></button>
    <button class="mbtn" data-key="tour"><span>Tour</span><i class="dot"></i></button>
    <button class="mbtn" data-key="contact"><span>Contact</span><i class="dot"></i></button>
    <button class="mbtn" data-key="shop"><span>Shop</span><i class="dot"></i></button>
  </nav>
  <div class="bottom-spacer"></div>

  <aside class="panel" id="panel" hidden aria-labelledby="pTitle">
    <header class="panel-head">
      <button class="pbtn" id="pBack" hidden>← Back</button>
      <h2 id="pTitle">Music</h2>
      <button class="pbtn" id="pClose" aria-label="패널 닫기">Close</button>
    </header>
    <div class="panel-body" id="pBody"></div>
    <p class="panel-foot">프로토타입 · 모든 콘텐츠는 샘플입니다</p>
  </aside>

  <button class="mute" id="mute" aria-pressed="false" aria-label="소리 끄기">
    <svg class="on" viewBox="0 0 24 24" fill="none" stroke="#13233F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="#A9D8F2"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
    <svg class="off" viewBox="0 0 24 24" fill="none" stroke="#13233F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="#A9D8F2"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
  </button>
  <div class="hint" id="hint" hidden>드래그해서 방을 둘러보고, 물건을 눌러 보세요</div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<div class="intro" id="intro">
  <span class="intro-tag">Prototype · 샘플 콘텐츠</span>
  <div>
    <svg class="logo" viewBox="0 0 300 300" role="img" aria-label="BLUE ROOM 로고">
      <defs><path id="arc" d="M 36 168 A 114 114 0 0 1 264 168"/></defs>
      <text font-family="Bagel Fat One, IBM Plex Sans KR, sans-serif" font-size="46" letter-spacing="5" fill="#13233F"><textPath href="#arc" startOffset="50%" text-anchor="middle">BLUE ROOM</textPath></text>
      <g stroke="#13233F" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
        <rect x="102" y="118" width="96" height="96" rx="8" fill="#F7FBFF"/>
        <path d="M110 126h80v80h-80z" fill="#DDF1FB" stroke-width="0"/>
        <circle cx="172" cy="146" r="11" fill="#F2C14E"/>
        <path d="M118 180c0-9 8-14 15-12 3-9 18-11 23-2 9-2 16 5 14 14z" fill="#F7FBFF"/>
        <path d="M150 118v96M102 166h96" fill="none"/>
        <path d="M92 214h116" fill="none"/>
      </g>
      <g fill="#13233F">
        <path d="M58 196l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
        <path d="M242 196l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
      </g>
      <text x="150" y="252" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-weight="700" font-size="15" fill="#13233F">하늘색 방에서 온 소리</text>
      <text x="150" y="272" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="2" fill="#3D6FB6">SOUND FROM THE SKY ROOM</text>
    </svg>
    <div class="intro-text" id="introText">
      <span class="loading" id="loading">LOADING <span id="pct">0</span>%</span>
    </div>
  </div>
</div>

<div class="cursor is-hidden" id="cursor" aria-hidden="true">
  <div class="cursor-inner">
    <svg viewBox="0 0 28 28"><path d="M4 3v20l5.6-5.2 3.9 8.2 3.6-1.6-3.8-8.1H21z" fill="#A9D8F2" stroke="#13233F" stroke-width="1.9" stroke-linejoin="round"/></svg>
    <span class="cursor-label" id="cursorLabel"></span>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(() => {
  "use strict";
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const D = reduceMotion ? 0.01 : 1;
  const finePointer = matchMedia("(pointer: fine)").matches;
  if (finePointer) document.body.classList.add("fine");
  const isPhone = () => innerWidth <= 640;
  const $ = (id) => document.getElementById(id);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  const C = {
    sky: "#A9D8F2", skyPale: "#DDF1FB", skyDeep: "#3D6FB6", ink: "#13233F", paper: "#F7FBFF",
    coral: "#F07A5E", sun: "#F2C14E", mint: "#7CCFB3", wall: "#BFE3F7", motif: "#8EC3E6",
    wood: "#C9935F", woodDark: "#9C6A3E", kraft: "#D9B48A",
  };

  /* ================= Sample content ================= */
  const DATA = {
    albums: [
      { artist: "BLUE ROOM", title: "하늘색 방 (Sky Room)", type: "LP", year: 2026, seed: 11, colors: [C.sky, C.skyDeep, C.coral, C.ink],
        tracks: [["창문 열기 (Open Window)", "3:12"], ["하늘색 방 (Sky Room)", "3:48"], ["구름 배달 (Cloud Delivery)", "4:12"], ["얼음 우유 (Ice Milk)", "3:21"], ["낮잠 (Nap)", "2:44"], ["파란 오후 (Blue Afternoon)", "3:05"], ["소파 위의 바다 (Sofa Sea)", "4:30"], ["불 끄기 (Lights Off)", "5:02"]] },
      { artist: "BLUE ROOM", title: "파란 오후 (Blue Afternoon)", type: "EP", year: 2025, seed: 23, colors: [C.skyDeep, C.sun, C.paper, C.paper],
        tracks: [["파란 오후 (Blue Afternoon)", "3:05"], ["택배 왔어요 (Delivery)", "2:58"], ["302호 (Room 302)", "3:40"], ["엘리베이터 (Elevator)", "3:16"], ["다시 오후 (Afternoon Again)", "4:01"]] },
      { artist: "MINT", title: "수영장 (Pool)", type: "Single", year: 2025, seed: 37, colors: [C.mint, C.paper, C.skyDeep, C.ink],
        tracks: [["수영장 (Pool)", "2:57"], ["수영장 (Pool) Inst.", "2:57"]] },
      { artist: "BLUE ROOM", title: "구름 배달 (Cloud Delivery)", type: "EP", year: 2024, seed: 41, colors: [C.paper, C.sky, C.coral, C.ink],
        tracks: [["구름 배달 (Cloud Delivery)", "4:12"], ["우체부 (Mailman)", "3:33"], ["소포 (Parcel)", "2:49"], ["하늘 주소 (Sky Address)", "3:58"], ["반송 (Return)", "3:10"], ["도착 (Arrival)", "4:44"]] },
      { artist: "HAEUL", title: "얼음 우유 (Ice Milk)", type: "Single", year: 2024, seed: 53, colors: [C.coral, C.paper, C.sky, C.ink],

  function resize() {
    const w = stage.clientWidth || innerWidth, h = stage.clientHeight || innerHeight;
    renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  addEventListener("resize", resize); resize();

  /* ---- picking ---- */
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  function pick(x, y) {
    const r = renderer.domElement.getBoundingClientRect();
    ndc.set(((x - r.left) / r.width) * 2 - 1, -((y - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObjects(solids, false)[0];
    let o = hit && hit.object; while (o && !o.userData.key) o = o.parent;
    return o ? o.userData.key : null;
  }

  /* ---- glow ---- */
  let hoverKey = null, activeKey = null;
  function refreshGlow() {
    for (const key in hot) {
      const on = key === hoverKey || key === activeKey;
      hot[key].outlines.forEach((ol) => {
        if (ol.userData.on === on) return; ol.userData.on = on;
        ol.material = on ? glowMat : inkMat;
        const s = ol.userData.size, t = ol.userData.t * (on ? 2.8 : 1);
        gsap.to(ol.scale, { x: 1 + (2 * t) / Math.max(s.x, 1e-3), y: 1 + (2 * t) / Math.max(s.y, 1e-3), z: 1 + (2 * t) / Math.max(s.z, 1e-3), duration: 0.3 * D, ease: "power1.inOut" });
      });
    }
  }

  /* ---- cursor ---- */
  const cursor = $("cursor"), cursorLabel = $("cursorLabel");
  let cx = 0, cy = 0;
  function moveCursor(x, y) {
    cx = x; cy = y;
    const rot = ((x / innerWidth) * 2 - 1) * 22;
    cursor.style.transform = `translate3d(${x - 4}px, ${y - 3}px, 0) rotate(${rot}deg)`;
  }

  /* ---- input ---- */
  let entered = false, down = null, dragging = false, hoverQueued = false;
  const el = renderer.domElement;
  el.addEventListener("pointerdown", (e) => {
    if (!entered) return;
    down = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, id: e.pointerId }; dragging = false;
    vel.x = vel.y = 0; gsap.killTweensOf(view);
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    cursor.classList.add("is-down");
  });
  el.addEventListener("pointermove", (e) => {
    if (!entered) return;
    if (down) {
      const dx = e.clientX - down.x, dy = e.clientY - down.y; down.x = e.clientX; down.y = e.clientY;
      if (!dragging && Math.hypot(e.clientX - down.sx, e.clientY - down.sy) > 6) { dragging = true; dismissHint(); if (activeKey) closePanel(false); }
      if (dragging) {
        const k = (view.fov / 75) * 0.0042;
        view.yaw -= dx * k; view.pitch = clamp(view.pitch + dy * k, -1.15, 1.15);
        vel.x = -dx * k; vel.y = dy * k;
      }
    } else hoverQueued = true;
  });
  function endPointer(e) {
    if (!down) return;
    cursor.classList.remove("is-down");
    const wasDrag = dragging; down = null; dragging = false;
    if (!wasDrag && e.type === "pointerup") { const key = pick(e.clientX, e.clientY); if (key) activate(key); }
  }
  el.addEventListener("pointerup", endPointer);
  el.addEventListener("pointercancel", endPointer);
  el.addEventListener("pointerleave", () => { if (!down) { hoverKey = null; refreshGlow(); cursor.classList.remove("is-hot"); } });
  el.addEventListener("wheel", (e) => {
    if (!entered) return; e.preventDefault();
    gsap.killTweensOf(view, "fov");
    view.fov = clamp(view.fov + e.deltaY * 0.03, 40, 95);
  }, { passive: false });
  addEventListener("pointermove", (e) => {
    if (e.pointerType !== "mouse") return;
    moveCursor(e.clientX, e.clientY);
    cursor.classList.toggle("is-hidden", e.target !== el);
  });
  addEventListener("keydown", (e) => { if (e.key === "Escape" && activeKey) closePanel(true); });

  /* ---- camera moves ---- */
  const FOV = { music: 40, video: 38, tour: 36, contact: 40, shop: 44 };
  const tmp = new THREE.Vector3(), bb = new THREE.Box3();
  function lookAtKey(key) {
    bb.setFromObject(hot[key].group).getCenter(tmp); tmp.sub(camera.position);
    let yaw = Math.atan2(tmp.x, -tmp.z), pitch = Math.atan2(tmp.y, Math.hypot(tmp.x, tmp.z));
    const fov = FOV[key], vf = (fov * Math.PI) / 180, hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);
    if (isPhone()) pitch -= vf * 0.22; else yaw -= hf * 0.15;
    let d = yaw - view.yaw; d = Math.atan2(Math.sin(d), Math.cos(d));
    vel.x = vel.y = 0;
    gsap.to(view, { yaw: view.yaw + d, pitch, fov, duration: 1.9 * D, ease: "power3.inOut", overwrite: true });
  }
  function zoomOut() { gsap.to(view, { fov: 75, pitch: -0.06, duration: 1.4 * D, ease: "power3.inOut", overwrite: true }); }

  /* ---- actions ---- */
  let lightsOn = true, globeVel = 0.25;
  const dayTint = new THREE.Color("#FFFFFF"), nightTint = new THREE.Color("#7487B3");
  function toggleLights() {
    lightsOn = !lightsOn; sfx.lamp();
    const night = !lightsOn, tint = night ? nightTint : dayTint;
    gsap.to(hemi, { intensity: night ? 0.3 : 0.8, duration: 0.6 * D });
    gsap.to(sun, { intensity: night ? 0 : 0.55, duration: 0.6 * D });
    gsap.to(lampLight, { intensity: night ? 1.9 : 0.25, duration: 0.6 * D });
    roomMats.forEach((m) => { if (m === skyMat) return; const c = m.userData.base.clone().multiply(tint); gsap.to(m.color, { r: c.r, g: c.g, b: c.b, duration: 0.6 * D }); });
    skyMat.map = night ? skyNight : skyDay; skyMat.needsUpdate = true;
    const sc = new THREE.Color(night ? "#5E77A8" : C.sky); gsap.to(scene.background, { r: sc.r, g: sc.g, b: sc.b, duration: 0.6 * D });
    toast(night ? "불을 껐어요. 램프만 켜져 있어요." : "다시 불을 켰어요.");
  }
  function randomTrip() {
    sfx.globe(); globeVel = 14;
    const [name, lat, lng] = DATA.trips[Math.floor(Math.random() * DATA.trips.length)];
    toast(`오늘의 랜덤 여행지: <b>${name}</b> · <a href="https://www.google.com/maps/@${lat},${lng},12z" target="_blank" rel="noopener">지도에서 보기</a>`);
  }
  function squish() {
    sfx.cushion();
    gsap.timeline().to(cushion.scale, { y: 0.7, x: 1.15, z: 1.1, duration: 0.12 * D }).to(cushion.scale, { y: 1, x: 1, z: 1, duration: 0.8 * D, ease: "elastic.out(1, 0.35)" });
  }
  function activate(key, fromMenu) {
    dismissHint();
    if (key === "lamp") return toggleLights();
    if (key === "globe") return randomTrip();
    if (key === "cushion") return squish();
    if (!fromMenu) sfx[key]();
    if (activeKey === "video" && key !== "video") stopVideo();
    activeKey = key; refreshGlow();
    lookAtKey(key); openPanel(key); menuSelect(key);
  }

  /* ---- menu (conveyor) ---- */
  const menu = $("menu");
  menu.addEventListener("click", (e) => {
    const b = e.target.closest(".mbtn"); if (!b || !entered) return;
    sfx.ui(); sfx[b.dataset.key](); activate(b.dataset.key, true);
  });
  function menuSelect(key) {
    const btns = [...menu.children], first = new Map(btns.map((b) => [b, b.getBoundingClientRect().left]));
    const idx = btns.findIndex((b) => b.dataset.key === key);
    if (idx > 0) [...btns.slice(idx), ...btns.slice(0, idx)].forEach((b) => menu.appendChild(b));
    btns.forEach((b) => {
      const active = b.dataset.key === key;
      b.classList.toggle("is-active", active);
      if (active) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current");
      const dx = first.get(b) - b.getBoundingClientRect().left;
      if (!dx) return;
      if (dx < 0) gsap.fromTo(b, { x: 60, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.7 * D, ease: "power3.out", delay: 0.1 * D });
      else gsap.fromTo(b, { x: dx }, { x: 0, duration: 0.8 * D, ease: "power3.inOut" });
    });
  }
  function menuClear() { [...menu.children].forEach((b) => { b.classList.remove("is-active"); b.removeAttribute("aria-current"); }); }

  /* ---- panel ---- */
  const panel = $("panel"), pBody = $("pBody"), pTitle = $("pTitle"), pBack = $("pBack");
  let backAction = null;
  $("pClose").addEventListener("click", () => closePanel(true));
  pBack.addEventListener("click", () => { if (backAction) backAction(); });
  function setBack(fn) { backAction = fn; pBack.hidden = !fn; }

  function openPanel(key) {
    pTitle.textContent = TITLES[key];
    setBack(null);
    ({ music: renderMusic, video: renderVideo, tour: renderTour, contact: renderContact, shop: renderShop })[key]();
    pBody.scrollTop = 0;
    panel.hidden = false;
    gsap.fromTo(panel, isPhone() ? { autoAlpha: 0, y: 30 } : { autoAlpha: 0, x: -24 }, { autoAlpha: 1, x: 0, y: 0, duration: 0.5 * D, delay: 0.55 * D, ease: "power3.out", overwrite: true });
  }
  function closePanel(withZoom) {
    if (activeKey === "video") stopVideo();
    activeKey = null; refreshGlow(); menuClear();
    gsap.to(panel, { autoAlpha: 0, duration: 0.25 * D, overwrite: true, onComplete: () => { panel.hidden = true; } });
    if (withZoom) zoomOut();
  }
  function swap(render) {
    gsap.to(pBody, { autoAlpha: 0, duration: 0.2 * D, onComplete: () => { render(); pBody.scrollTop = 0; gsap.to(pBody, { autoAlpha: 1, duration: 0.25 * D }); } });
  }

  function renderMusic() {
    pBody.innerHTML = `<div class="grid">${DATA.albums.map((a, i) => `
      <button class="card" data-i="${i}">
        <img src="${a.cover}" alt="">
        <span class="card-artist">${a.artist}</span>
        <span class="card-title">${a.title}</span>
        <span class="card-meta">${a.type} · ${a.year}</span>
      </button>`).join("")}</div>`;
    pBody.querySelectorAll(".card").forEach((b) => b.addEventListener("click", () => { sfx.ui(); swap(() => renderAlbum(+b.dataset.i)); }));
  }
  function renderAlbum(i) {
    const a = DATA.albums[i];
    setBack(() => { sfx.ui(); setBack(null); swap(renderMusic); });
    pBody.innerHTML = `<div class="album">
      <img class="album-cover" src="${a.cover}" alt="${a.title} 앨범 커버">
      <div class="album-info"><p class="card-artist">${a.artist}</p><h3>${a.title}</h3><p class="card-meta">${a.type} · ${a.year} · ${a.tracks.length} tracks</p></div>
      <ol class="tracks">${a.tracks.map(([t, l], k) => `<li><span>${String(k + 1).padStart(2, "0")}. ${t}</span><span>${l}</span></li>`).join("")}</ol>
      <p class="label">Listen on</p>
      <div class="chips">${["Spotify", "Apple Music", "Melon", "YouTube Music", "Bandcamp"].map((s) => `<button class="pbtn sample-link">${s}</button>`).join("")}</div>
    </div>`;
    bindSampleLinks();
  }
  function renderVideo() {
    pBody.innerHTML = `<div class="grid wide">${DATA.videos.map((v, i) => `
      <button class="card${tv.playing === i ? " is-playing" : ""}" data-i="${i}">
        <img src="${v.poster}" alt="">
        <span class="card-title">${v.title}</span>
        <span class="card-meta">${tv.playing === i ? "■ TV에서 재생 중 · 눌러서 정지" : "▶ " + v.len}</span>
      </button>`).join("")}</div>`;
    pBody.querySelectorAll(".card").forEach((b) => b.addEventListener("click", () => {
      const i = +b.dataset.i;
      if (tv.playing === i) stopVideo(); else playVideo(i);
      const st = pBody.scrollTop, sl = pBody.querySelector(".grid").scrollLeft;
      renderVideo(); pBody.scrollTop = st; pBody.querySelector(".grid").scrollLeft = sl;
    }));
  }
  function playVideo(i) { sfx.video(); tv.playing = i; tv.start = performance.now(); setBgm(0.08); }
  function stopVideo() { if (tv.playing < 0) return; tv.playing = -1; setBgm(0.55); }
  function renderTour() {
    const days = ["일", "월", "화", "수", "목", "금", "토"], mons = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
    const label = { on: "Tickets", sold: "Sold out", soon: "Soon" };
    pBody.innerHTML = `<ul class="tour">${DATA.tour.map((t) => {
      const d = new Date(t.date + "T12:00:00");
      return `<li>
        <time class="t-date" datetime="${t.date}"><small>${mons[d.getMonth()]} ${d.getFullYear()}</small><b>${String(d.getDate()).padStart(2, "0")}</b></time>
        <div class="t-place"><b>${t.city}</b><span>${t.venue} · ${days[d.getDay()]}요일</span></div>
        <button class="pbtn ${t.status === "on" ? "sample-link" : t.status}" ${t.status === "sold" ? 'aria-disabled="true"' : ""}>${label[t.status]}</button>
      </li>`; }).join("")}</ul>`;
    bindSampleLinks();
  }
  function renderContact() {
    const row = ([l, m]) => `<div class="crow"><b>${l}</b><code>${m}</code><button class="pbtn copy" data-m="${m}">Copy</button></div>`;
    pBody.innerHTML = `<div class="contact">
      <section><p class="label">Management</p>${DATA.contact.management.map(row).join("")}</section>
      <section><p class="label">Booking</p>${DATA.contact.booking.map(row).join("")}</section>
      <section><p class="label">Follow us</p><div class="chips">${DATA.contact.follow.map((s) => `<button class="pbtn sample-link">${s}</button>`).join("")}</div></section>
    </div>`;
    pBody.querySelectorAll(".copy").forEach((b) => b.addEventListener("click", () => {
      const m = b.dataset.m;
      const fallback = () => { const r = document.createRange(); r.selectNodeContents(b.previousElementSibling); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("주소를 선택해 두었어요. 복사해서 쓰세요."); };
      try { navigator.clipboard.writeText(m).then(() => { b.textContent = "Copied"; setTimeout(() => (b.textContent = "Copy"), 1600); }, fallback); } catch (_) { fallback(); }
    }));
    bindSampleLinks();
  }
  function renderShop() {
    pBody.innerHTML = `<div class="grid">${DATA.shop.map((p) => `
      <div class="card"><img src="${p.img}" alt=""><span class="card-artist">${p.name}</span><span class="card-meta">${p.price}</span></div>`).join("")}</div>
      <p class="shop-note">원본 사이트처럼 쇼핑백을 누르면 외부 스토어로 연결되는 자리입니다. 지금은 예시 링크예요.</p>
      <a class="store-link" href="https://example.com" target="_blank" rel="noopener">스토어 열기 ↗</a>`;
  }
  function bindSampleLinks() {
    pBody.querySelectorAll(".sample-link").forEach((b) => b.addEventListener("click", () => toast(`<b>${b.textContent}</b> 링크 자리입니다. 실제 URL은 CMS에서 연결하세요.`)));
  }

  /* ---- hint ---- */
  let hintShown = false;
  function showHint() { const h = $("hint"); h.hidden = false; hintShown = true; gsap.from(h, { autoAlpha: 0, y: 8, duration: 0.5 }); }
  function dismissHint() { if (!hintShown) return; hintShown = false; gsap.to($("hint"), { autoAlpha: 0, duration: 0.4, onComplete: () => ($("hint").hidden = true) }); }

  /* ---- enter ---- */
  function enter() {
    audioInit(); sfx.ui();
    document.body.classList.add("entered");
    gsap.to($("intro"), { autoAlpha: 0, duration: 0.5 * D, onComplete: () => ($("intro").hidden = true) });
    gsap.fromTo(view, { fov: 130, pitch: -0.55, yaw: 0 }, { fov: 75, pitch: -0.06, duration: 2.2 * D, ease: "power3.inOut", delay: 0.2 * D,
      onComplete: () => { entered = true; showHint(); } });
    gsap.from(".mbtn", { autoAlpha: 0, y: isPhone() ? 16 : -16, stagger: 0.07, duration: 0.5 * D, delay: 1.3 * D });
    gsap.from("#mute", { autoAlpha: 0, duration: 0.5 * D, delay: 1.6 * D });
  }

  /* ---- loop ---- */
  let lastT = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
    if (entered && !down && (Math.abs(vel.x) > 1e-5 || Math.abs(vel.y) > 1e-5)) {
      view.yaw += vel.x; view.pitch = clamp(view.pitch + vel.y, -1.15, 1.15); vel.x *= 0.9; vel.y *= 0.9;
    }
    if (hoverQueued && finePointer) {
      hoverQueued = false;
      const k = pick(cx, cy);
      if (k !== hoverKey) { hoverKey = k; refreshGlow(); }
      cursor.classList.toggle("is-hot", !!k); if (k) cursorLabel.textContent = LABELS[k];
    }
    applyView();
    record.rotation.y -= dt * (activeKey === "music" ? 3.5 : 0.5);
    globeBall.rotation.y += dt * globeVel; globeVel = 0.25 + (globeVel - 0.25) * Math.pow(0.3, dt);
    drawTV(now);
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }

  /* ---- boot: wait briefly for fonts so canvas art uses them ---- */
  const fontLoads = document.fonts ? Promise.all(['700 20px "IBM Plex Sans KR"', '600 16px "IBM Plex Mono"', '400 40px "Bagel Fat One"'].map((f) => document.fonts.load(f))) : Promise.resolve();
  Promise.race([fontLoads, new Promise((r) => setTimeout(r, 1500))]).catch(() => {}).then(() => {
    DATA.albums.forEach((a) => (a.canvas = art(a.seed, a.colors, 400, 400, a.title.split(" (")[0]), a.cover = a.canvas.toDataURL("image/jpeg", 0.85)));
    DATA.videos.forEach((v) => (v.poster = art(v.seed, v.colors, 480, 270, "▶ " + v.len).toDataURL("image/jpeg", 0.85)));
    DATA.shop.forEach((p) => (p.img = art(p.seed, p.colors, 400, 400, p.name).toDataURL("image/jpeg", 0.85)));
    frame(-4.96, 1.85, -0.25, Math.PI / 2, 0.55, DATA.albums[0].canvas);
    frame(-4.96, 1.95, 0.7, Math.PI / 2, 0.42, DATA.albums[3].canvas);
    frame(1.2, 1.8, 4.96, Math.PI, 0.7, DATA.albums[1].canvas);
    frame(2.4, 1.6, 4.96, Math.PI, 0.5, DATA.albums[5].canvas);
    scene.traverse((o) => { if (o.isMesh && !o.userData.isOutline && !solids.includes(o)) solids.push(o); });
    // re-draw text-bearing textures now that fonts are in
    [ticketTex, bagTex].forEach((t) => t.redraw());
    applyView(); requestAnimationFrame(loop);
    sceneReadyResolve(true);
  });
})();
</script>

</body>
