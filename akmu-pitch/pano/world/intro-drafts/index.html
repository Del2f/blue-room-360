<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소문의 낙원 — 진입 시안</title>
<meta name="robots" content="noindex, nofollow, noimageindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Special+Elite&display=swap">
<style>
  /* Review page for the three entry drafts (?intro=1..3) of the 360 page. */
  :root { --ink: #f3ead8; --soft: rgba(243, 234, 216, .62); --gold: #ffc832; --bg: #14100c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Special Elite", "Gowun Batang", serif; }
  .glass { position: relative; background: rgba(0, 0, 0, .4); -webkit-backdrop-filter: saturate(120%) blur(14px); backdrop-filter: saturate(120%) blur(14px);
    box-shadow: 0 4px 16px rgba(0, 0, 0, .3), inset 0 1px rgba(255, 255, 255, .08), inset 0 0 0 1px rgba(255, 255, 255, .1); border-radius: 999px; }
  .glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; background: linear-gradient(135deg, rgba(255, 255, 255, .4), rgba(255, 255, 255, 0) 35% 65%, rgba(255, 255, 255, .4));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#fff 0 0) content-box exclude, linear-gradient(#fff 0 0); }
  header { max-width: 1280px; margin: 0 auto; padding: 48px 16px 8px; }
  h1 { margin: 0; font-weight: 400; font-size: clamp(32px, 6vw, 56px); line-height: 1.05; }
  header p { margin: 14px 0 0; font-family: "Gowun Batang", serif; font-size: 15px; line-height: 1.75; color: var(--soft); max-width: 820px; }
  section { max-width: 1280px; margin: 0 auto; padding: 40px 16px; border-top: 1px solid rgba(255, 255, 255, .1); }
  .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 18px; }
  .head b { font-weight: 400; font-size: 13px; color: var(--gold); }
  .head h2 { margin: 0; font-weight: 400; font-size: 28px; }
  .head span { font-family: "Gowun Batang", serif; color: var(--soft); }
  .head a { margin-left: auto; color: var(--ink); text-decoration: none; padding: 10px 16px; font-size: 13px; }
  .head a i { color: var(--gold); font-style: normal; margin-right: 6px; }
  .desc { margin: 14px 0 20px; font-family: "Gowun Batang", serif; font-size: 15px; line-height: 1.8; color: var(--soft); max-width: 920px; }
  .desc strong { color: var(--ink); }
  .steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .steps.m { grid-template-columns: repeat(4, minmax(0, 150px)); margin-top: 14px; }
  figure { margin: 0; } img { display: block; width: 100%; height: auto; border-radius: 10px; }
  figcaption { font-size: 11px; color: var(--soft); margin-top: 6px; letter-spacing: .06em; text-transform: uppercase; }
  @media (max-width: 760px) { .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); } .steps.m { grid-template-columns: repeat(4, minmax(0, 1fr)); } .head a { margin-left: 0; } }
</style>
</head>
<body>
<header>
  <h1>Entry Drafts · Paradise of Rumors 360</h1>
  <p>사이트에 처음 들어오는 순간을 화면 전체로 쓰도록 바꾼 세 가지 진입 시안입니다. 지금은 검은 화면 가운데에 작은 로딩 바만 있습니다. 세 시안은 로딩하는 동안부터 낙원을 보여 주고, 타이틀은 화면 끝에서 끝까지 씁니다. 입장한 뒤 첫 시야도 72°에서 84°(세로 화면은 92°)로 넓혀 낙원이 한눈에 더 많이 들어옵니다. 각 시안은 로딩 완료, 입장 직후, 전환 중, 도착 네 장면으로 보여 줍니다. 버튼을 누르면 실제 화면에서 처음부터 볼 수 있습니다.</p>
</header>
<main id="list"></main>
<script>
  const DRAFTS = [
    ["LITTLE PLANET", "작은 행성이 펼쳐지는 진입",
      "로딩 중에 낙원 전체가 <strong>작은 행성</strong>처럼 둥글게 말려 화면 가운데에서 천천히 돕니다. 360° 파노라마를 바로 아래로 내려다보는 스테레오그래픽 투영을 WebGL 셰이더로 직접 그렸습니다. 아래에는 화면 폭을 가득 채운 '소문의 낙원', 위에는 'PARADISE OF RUMORS' 글자를 화면 양 끝까지 벌려 놓았습니다. 입장하면 행성이 <strong>펼쳐지며</strong> 고개가 들리고, 일반 시점으로 이음매 없이 이어집니다."],
    ["CINEMASCOPE", "360° 전체를 한 줄의 와이드 띠로",
      "로딩 화면에서 낙원 360° 전체가 화면 가로를 꽉 채운 <strong>초광각 띠</strong>로 펼쳐져 천천히 흐릅니다. 띠 위아래로 '소문의'와 '낙원'이 영화 타이틀처럼 걸립니다. 입장하면 두 단어가 좌우로 빠져나가고, 띠가 위아래로 열리면서 평평한 파노라마가 원근 시점으로 휘어 들어와 그 자리에 서게 됩니다. 세로 화면에서는 띠가 약 140°를 보여 줍니다."],
    ["POSTER", "12단 그리드 위의 풀블리드 타이포 포스터",
      "로딩 화면이 한 장의 <strong>포스터</strong>가 됩니다. 뒤로는 흐린 유리 너머 낙원이 넓게 보이고, 12단 그리드 위로 거대한 '소문의 / 낙원'이 화면을 가득 채웁니다. 오른쪽 단에는 선공개곡·타이틀곡·앨범 정보를 놓고, 아래에는 참고 사이트의 눈금자처럼 0–100 <strong>로딩 눈금</strong>이 금색으로 차오르며, 왼쪽에는 큰 숫자 카운터가 있습니다. 입장하면 글자가 위로 흩어지고 그리드가 퍼지며 유리가 맑아집니다."],
  ];
  const STEPS = ["로딩 완료", "입장 직후", "전환 중", "도착"];
  document.getElementById("list").innerHTML = DRAFTS.map(([en, ko, desc], i) => {
    const n = i + 1;
    return `<section>
      <div class="head"><b>ENTRY 0${n}</b><h2>${en}</h2><span>${ko}</span><a class="glass" href="../?intro=${n}"><i>✦</i>처음부터 보기</a></div>
      <p class="desc">${desc}</p>
      <div class="steps">${STEPS.map((t, k) => `<figure><img src="i${n}_d_${k}.jpg" alt="" loading="lazy"><figcaption>${k + 1} · ${t}</figcaption></figure>`).join("")}</div>
      <div class="steps m">${STEPS.map((t, k) => `<figure><img src="i${n}_m_${k}.jpg" alt="" loading="lazy"><figcaption>Mobile ${k + 1}</figcaption></figure>`).join("")}</div>
    </section>`;
  }).join("");
</script>
</body>
</html>
